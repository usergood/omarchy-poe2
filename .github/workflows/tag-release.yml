name: Tag release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/test.yml
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish tested tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"
          notes="$RUNNER_TEMP/release-notes.md"
          tag=$(python3 .github/scripts/prepare_release.py --notes-file "$notes")
          [[ "$tag" == "tag=$GITHUB_REF_NAME" ]]
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null; then
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "PoE 2 Companion $GITHUB_REF_NAME" --notes-file "$notes"
          fi
