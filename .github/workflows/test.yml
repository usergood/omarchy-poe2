name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q backend.py poe2
      - name: Check JSON manifests and translations
        run: python -c "import json,pathlib; [json.loads(p.read_text()) for p in [pathlib.Path('manifest.json'),*pathlib.Path('i18n').glob('*.json')]]"
